name: lazim
description: "Lazim â€” a shared family needs list. One portal for everything the home needs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  firebase_messaging: ^17.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  cached_network_image: ^4.0.7
  image_picker: ^1.2.4
  file_picker: ^13.4.1
  app_links: ^7.2.2
  share_plus: ^13.3.1
  http: ^1.6.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  flutter_local_notifications: 22.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
