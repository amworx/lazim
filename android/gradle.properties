# Gradle JVM settings for Lazim.
#
# This machine has ~7.4 GB of physical RAM. The Flutter template default of
# -Xmx8G -XX:MaxMetaspaceSize=4G asks for more than the box has, so the daemon
# is killed by the OS mid-build (surfaces as "Gradle build daemon disappeared"
# plus a hs_err_pid*.log saying "insufficient memory ... failed to map").
#
# Sized to fit: 3 GB heap + 1 GB metaspace leaves room for the Kotlin compiler,
# R8/D8, and the Dart/Flutter tooling running alongside. Raise these only on a
# machine with more RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Build faster on a many-core box without exhausting memory.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
